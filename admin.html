<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OX Admin</title><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap"><div class="brand">2026 SEMICONDUCTOR FORUM · ADMIN</div><h1>O/X Live Poll Control</h1>
<section id="login" class="card" style="max-width:520px"><h2>관리자 로그인</h2><label>이메일</label><input id="email" type="email"><label>비밀번호</label><input id="pw" type="password"><button id="loginBtn" class="btn primary" style="margin-top:16px">로그인</button><div id="loginMsg" class="status" style="margin-top:12px">관리자 계정으로 로그인하세요.</div></section>
<section id="panel" hidden><div id="notice" class="status" style="margin-bottom:16px">연결 중...</div><div class="grid2">
<div class="card"><h2>실행할 문항</h2><h2 id="current">선택된 문항 없음</h2><div class="status" id="applyState">아래 목록에서 문항을 선택하고 ‘이 문항 적용’을 눌러주세요.</div>
<label>진행 시간</label><select id="duration"><option value="30">30초</option><option value="60">1분</option></select><label>결과 공개</label><select id="mode"><option value="live">실시간 공개</option><option value="hidden">종료 후 공개</option></select>
<div class="row" style="margin-top:16px"><button id="start" class="btn primary">START</button><button id="stop" class="btn danger">강제 종료</button><button id="reveal" class="btn">결과보기</button></div><div class="row" style="margin-top:22px"><div><span class="muted">참여</span><div id="total" class="metric">0</div></div><div><span class="muted">O</span><div id="oc" class="metric">0</div></div><div><span class="muted">X</span><div id="xc" class="metric">0</div></div></div><div id="timer" class="timer">--:--</div><button id="reset" class="btn danger" style="margin-top:18px">현재 결과 초기화</button></div>
<div class="card"><h2>문항 관리 <span id="qcount" class="badge">0 / 5</span></h2><label>문항 작성</label><textarea id="qtext" placeholder="문항을 입력하세요"></textarea><div class="row"><button id="newSave" class="btn primary">새 문항 저장</button><button id="editSave" class="btn">선택 문항 수정 저장</button><button id="del" class="btn danger">삭제</button></div><div id="saveMsg" class="status" style="margin-top:12px">최대 5개까지 저장할 수 있습니다.</div><h3>저장된 문항</h3><div id="qlist" class="list"></div><button id="apply" class="btn primary" style="margin-top:16px;width:100%">이 문항 적용</button></div></div>
<div class="row" style="margin-top:16px"><button id="logout" class="btn">로그아웃</button><a href="display.html" target="_blank" class="btn" style="text-decoration:none">LED 화면 열기</a></div></section></main>
<script type="module">
import{auth,db,ADMIN_UID,signInWithEmailAndPassword,onAuthStateChanged,signOut,ref,onValue,set,update,remove,push,countVotes,esc}from"./app.js";
const $=i=>document.getElementById(i);let event={},qs={},votes={},selected=null,currentVoteQ=null,voteUnsub=null,tick=null,started=false,serverOffset=0;
const now=()=>Date.now()+serverOffset;const say=(m,ok=true)=>$("saveMsg").innerHTML=`<span class="${ok?"ok":"err"}">${m}</span>`;
$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pw").value)}catch{$("loginMsg").innerHTML='<span class="err">로그인 정보를 확인해 주세요.</span>'}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{const ok=u?.uid===ADMIN_UID;$("login").hidden=ok;$("panel").hidden=!ok;if(u&&!ok)signOut(auth);if(ok&&!started){started=true;listeners()}});
function listeners(){
 onValue(ref(db,".info/serverTimeOffset"),s=>serverOffset=s.val()||0);
 onValue(ref(db,"event"),s=>{event=s.val()||{};switchVotes();render()});
 onValue(ref(db,"questions"),s=>{qs=s.val()||{};if(selected&&!qs[selected])selected=null;render()});
 $("notice").innerHTML='<span class="ok">✓ Firebase 실시간 연결 완료</span>';
}
function switchVotes(){if(!event.currentQuestion||currentVoteQ===event.currentQuestion)return;currentVoteQ=event.currentQuestion;votes={};if(voteUnsub)voteUnsub();voteUnsub=onValue(ref(db,`votes/${currentVoteQ}`),s=>{votes=s.val()||{};render()})}
function render(){
 $("current").textContent=qs[event.currentQuestion]?.text||"선택된 문항 없음";$("applyState").innerHTML=event.currentQuestion?'<span class="ok">✓ 참가자/LED에 적용된 문항입니다.</span>':"적용된 문항이 없습니다.";
 const c=countVotes(votes);$("total").textContent=c.total;$("oc").textContent=c.o;$("xc").textContent=c.x;$("qcount").textContent=`${Object.keys(qs).length} / 5`;
 const es=Object.entries(qs);$("qlist").innerHTML=es.length?es.map(([id,q],i)=>`<div class="qitem ${id===selected?"active":""}" data-id="${id}"><b>Q${i+1}.</b> ${esc(q.text)} ${id===event.currentQuestion?'<span class="badge">적용 중</span>':""}</div>`).join(""):'<div class="status">저장된 문항이 없습니다.</div>';
 document.querySelectorAll(".qitem").forEach(el=>el.onclick=()=>{selected=el.dataset.id;$("qtext").value=qs[selected]?.text||"";render();say("문항을 선택했습니다. 적용하려면 아래 ‘이 문항 적용’을 누르세요.")});
 $("newSave").disabled=Object.keys(qs).length>=5;
 clearInterval(tick);const draw=async()=>{const active=event.status==="voting"&&Number(event.closesAt||0)>now();$("timer").textContent=active?`00:${String(Math.max(0,Math.ceil((Number(event.closesAt)-now())/1000))).padStart(2,"0")}`:"--:--";if(event.status==="voting"&&Number(event.closesAt||0)<=now()){try{await update(ref(db,"event"),{status:"closed"})}catch{}}};draw();tick=setInterval(draw,500);
}
$("newSave").onclick=async()=>{const t=$("qtext").value.trim();if(!t)return say("문항을 입력해 주세요.",false);if(Object.keys(qs).length>=5)return say("문항은 최대 5개까지 저장할 수 있습니다.",false);try{const r=push(ref(db,"questions"));await set(r,{text:t});selected=r.key;$("qtext").value="";say("✓ 새 문항을 저장했습니다. 목록에서 확인 후 ‘이 문항 적용’을 눌러주세요.")}catch(e){say("저장 실패: "+esc(e.message),false)}};
$("editSave").onclick=async()=>{const t=$("qtext").value.trim();if(!selected)return say("수정할 문항을 목록에서 선택해 주세요.",false);if(!t)return say("문항 내용을 입력해 주세요.",false);if(event.status==="voting"&&selected===event.currentQuestion)return say("진행 중인 문항은 수정할 수 없습니다.",false);try{await set(ref(db,`questions/${selected}/text`),t);say("✓ 수정 내용을 저장했습니다.")}catch(e){say("수정 실패: "+esc(e.message),false)}};
$("apply").onclick=async()=>{if(!selected||!qs[selected])return say("적용할 문항을 목록에서 먼저 선택해 주세요.",false);if(event.status==="voting")return say("투표 진행 중에는 문항을 바꿀 수 없습니다.",false);try{await update(ref(db,"event"),{currentQuestion:selected,status:"waiting",showResults:false});say("✓ 이 문항을 참가자/LED 화면에 적용했습니다.")}catch(e){say("적용 실패: "+esc(e.message),false)}};
$("del").onclick=async()=>{if(!selected)return say("삭제할 문항을 선택해 주세요.",false);if(event.status==="voting"&&selected===event.currentQuestion)return say("진행 중인 문항은 삭제할 수 없습니다.",false);if(!confirm("선택 문항을 삭제할까요?"))return;try{await remove(ref(db,`questions/${selected}`));try{await remove(ref(db,`votes/${selected}`))}catch{};if(event.currentQuestion===selected)await update(ref(db,"event"),{currentQuestion:null,status:"waiting",showResults:false});selected=null;$("qtext").value="";say("✓ 삭제했습니다.")}catch(e){say("삭제 실패: "+esc(e.message),false)}};
$("start").onclick=async()=>{if(!event.currentQuestion||!qs[event.currentQuestion])return alert("먼저 문항을 적용하세요.");const d=Number($("duration").value),n=now();try{await update(ref(db,"event"),{status:"voting",duration:d,startedAt:n,closesAt:n+d*1000,resultMode:$("mode").value,showResults:$("mode").value==="live"})}catch(e){alert("START 실패: "+e.message)}};
$("stop").onclick=()=>update(ref(db,"event"),{status:"closed",closesAt:now()});$("reveal").onclick=()=>update(ref(db,"event"),{status:"closed",showResults:true});$("reset").onclick=async()=>{if(event.currentQuestion&&confirm("현재 적용 문항의 투표 결과를 초기화할까요?"))try{await remove(ref(db,`votes/${event.currentQuestion}`));say("✓ 결과를 초기화했습니다.")}catch(e){say("초기화 실패: "+esc(e.message),false)}};
</script></body></html>
