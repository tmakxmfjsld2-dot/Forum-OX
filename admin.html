<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OX Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><div class="brand">2026 SEMICONDUCTOR FORUM · ADMIN</div><h1>O/X Live Poll Control</h1><section id="login" class="card" style="max-width:520px"><h2>관리자 로그인</h2><label>이메일</label><input id="email" type="email"><label>비밀번호</label><input id="pw" type="password"><button id="loginBtn" class="btn primary" style="margin-top:16px">로그인</button><div id="loginMsg" class="status" style="margin-top:12px">Firebase 관리자 계정으로 로그인하세요.</div></section><section id="panel" hidden><div class="grid2"><div class="card"><h2>현재 문항</h2><h2 id="current">문항 없음</h2><label>진행 시간</label><select id="duration"><option value="30">30초</option><option value="60">1분</option></select><label>결과 공개</label><select id="mode"><option value="live">실시간 공개</option><option value="hidden">종료 후 공개</option></select><div class="row" style="margin-top:16px"><button id="start" class="btn primary">START</button><button id="stop" class="btn danger">강제 종료</button><button id="reveal" class="btn">결과보기</button></div><div class="row" style="margin-top:22px"><div><span class="muted">참여</span><div id="total" class="metric">0</div></div><div><span class="muted">O</span><div id="oc" class="metric">0</div></div><div><span class="muted">X</span><div id="xc" class="metric">0</div></div></div><div id="timer" class="timer">--:--</div><button id="reset" class="btn danger" style="margin-top:18px">현재 결과 초기화</button></div><div class="card"><h2>문항 관리</h2><label>문항</label><textarea id="qtext" placeholder="질문을 입력하세요"></textarea><div class="row"><button id="add" class="btn primary">문항 추가</button><button id="save" class="btn">현재 문항 수정</button><button id="del" class="btn danger">삭제</button></div><div id="qlist" class="list" style="margin-top:18px"></div></div></div><div class="row" style="margin-top:16px"><button id="logout" class="btn">로그아웃</button><a href="display.html" target="_blank" class="btn" style="text-decoration:none">LED 화면 열기</a></div></section></main><script type="module">
import{auth,db,ADMIN_UID,signInWithEmailAndPassword,onAuthStateChanged,signOut,ref,onValue,set,update,remove,push,countVotes,esc,left,clock}from"./app.js";const $=i=>document.getElementById(i);let event={},qs={},votes={},votePath="",tick;
$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value,$("pw").value)}catch{$("loginMsg").innerHTML='<span class="err">로그인 정보를 확인해 주세요.</span>'}};onAuthStateChanged(auth,u=>{const ok=u?.uid===ADMIN_UID;$("login").hidden=ok;$("panel").hidden=!ok;if(u&&!ok)signOut(auth)});$("logout").onclick=()=>signOut(auth);
onValue(ref(db,"event"),s=>{event=s.val()||{};watchVotes();render()});onValue(ref(db,"questions"),s=>{qs=s.val()||{};render()});
function watchVotes(){if(!event.currentQuestion||votePath===event.currentQuestion)return;votePath=event.currentQuestion;votes={};onValue(ref(db,`votes/${votePath}`),s=>{votes=s.val()||{};render()})}
function render(){const q=qs[event.currentQuestion];$("current").textContent=q?.text||"문항을 추가하세요.";const c=countVotes(votes);$("total").textContent=c.total;$("oc").textContent=c.o;$("xc").textContent=c.x;$("qlist").innerHTML=Object.entries(qs).map(([id,q])=>`<div class="qitem ${id===event.currentQuestion?"active":""}" data-id="${id}">${esc(q.text)}</div>`).join("");document.querySelectorAll(".qitem").forEach(e=>e.onclick=()=>set(ref(db,"event/currentQuestion"),e.dataset.id));$("duration").value=String(event.duration||30);$("mode").value=event.resultMode||"live";clearInterval(tick);const d=()=>$("timer").textContent=event.status==="voting"?clock(left(event.closesAt)):"--:--";d();tick=setInterval(d,250)}
$("add").onclick=async()=>{const t=$("qtext").value.trim();if(!t)return;const r=push(ref(db,"questions"));await set(r,{text:t});await set(ref(db,"event/currentQuestion"),r.key);$("qtext").value=""};$("save").onclick=async()=>{if(event.status==="voting")return alert("진행 중에는 수정할 수 없습니다.");const t=$("qtext").value.trim();if(t&&event.currentQuestion)await set(ref(db,`questions/${event.currentQuestion}/text`),t)};$("del").onclick=async()=>{if(event.status==="voting")return alert("진행 중에는 삭제할 수 없습니다.");if(event.currentQuestion&&confirm("현재 문항을 삭제할까요?")){await remove(ref(db,`questions/${event.currentQuestion}`));await remove(ref(db,`votes/${event.currentQuestion}`));await set(ref(db,"event/currentQuestion"),null)}};$("start").onclick=async()=>{if(!event.currentQuestion)return alert("문항을 먼저 선택하세요.");const d=Number($("duration").value),n=Date.now();await update(ref(db,"event"),{status:"voting",duration:d,startedAt:n,closesAt:n+d*1000,resultMode:$("mode").value,showResults:$("mode").value==="live"})};$("stop").onclick=()=>update(ref(db,"event"),{status:"closed",closesAt:Date.now()});$("reveal").onclick=()=>update(ref(db,"event"),{status:"closed",showResults:true});$("reset").onclick=async()=>{if(event.currentQuestion&&confirm("현재 문항의 모든 투표를 초기화할까요?"))await remove(ref(db,`votes/${event.currentQuestion}`))};
</script></body></html>
