<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OX LED</title><link rel="stylesheet" href="style.css"></head>
<body><main class="display"><div class="row space"><div class="brand">2026 SEMICONDUCTOR FORUM · LIVE POLL</div><div class="row"><span id="state" class="badge">연결 중</span><span id="timer" class="timer">--:--</span></div></div>
<div id="question" class="question" style="margin-top:5vh">곧 질문이 시작됩니다.</div><div class="meta muted" style="margin-top:2vh">현재 참여 <b id="total" style="color:white">0</b>명</div><div id="waiting" class="big" style="margin:auto 0;color:var(--gold2)">O · X</div>
<div id="results" class="results" hidden><section><div class="row space"><div class="big" style="color:var(--gold2)">O</div><div id="op" class="big">0%</div></div><div class="bar"><div id="obar" class="fill"></div></div><div class="meta muted"><span id="oc">0</span>명</div></section><section><div class="row space"><div class="big">X</div><div id="xp" class="big">0%</div></div><div class="bar"><div id="xbar" class="fill x"></div></div><div class="meta muted"><span id="xc">0</span>명</div></section></div></main>
<script type="module">
import{auth,db,signInAnonymously,ref,onValue,countVotes,pct}from"./app.js";
const $=i=>document.getElementById(i);let event={},qs={},votes={},voteUnsub=null,currentQ=null,tick=null,serverOffset=0;
const now=()=>Date.now()+serverOffset;
onValue(ref(db,".info/serverTimeOffset"),s=>serverOffset=s.val()||0);
signInAnonymously(auth);
onValue(ref(db,"questions"),s=>{qs=s.val()||{};render()});
onValue(ref(db,"event"),s=>{event=s.val()||{};switchVotes();render()});
function switchVotes(){if(!event.currentQuestion||currentQ===event.currentQuestion)return;currentQ=event.currentQuestion;votes={};if(voteUnsub)voteUnsub();voteUnsub=onValue(ref(db,`votes/${currentQ}`),s=>{votes=s.val()||{};render()})}
function render(){
 $("question").textContent=qs[event.currentQuestion]?.text||"곧 질문이 시작됩니다.";
 const c=countVotes(votes),o=pct(c.o,c.total),x=pct(c.x,c.total);$("total").textContent=c.total;$("oc").textContent=c.o;$("xc").textContent=c.x;$("op").textContent=o+"%";$("xp").textContent=x+"%";$("obar").style.width=o+"%";$("xbar").style.width=x+"%";
 const active=event.status==="voting"&&Number(event.closesAt||0)>now();const show=(event.resultMode==="live"&&active)||event.showResults===true;
 $("results").hidden=!show;$("waiting").hidden=show;$("state").textContent=active?"LIVE":event.status==="waiting"?"READY":"CLOSED";
 clearInterval(tick);const d=()=>{$("timer").textContent=active?`00:${String(Math.max(0,Math.ceil((Number(event.closesAt)-now())/1000))).padStart(2,"0")}`:"--:--"};d();if(active)tick=setInterval(d,250);
}
</script></body></html>
